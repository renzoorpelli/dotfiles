
# Prefix: ctrl+a (frees ctrl+b, easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 50000
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc,xterm-ghostty:Tc"
set -g extended-keys on
set -g status-style "fg=#9ccfd8,bg=#3a3a3a"

# Navigate panes: ctrl+h/j/k/l (no prefix — mirrors Ghostty's cmd+h/j/k/l)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Create splits: prefix + h/j/k/l (open in current directory)
bind h split-window -hb -c "#{pane_current_path}"
bind j split-window -v  -c "#{pane_current_path}"
bind k split-window -vb -c "#{pane_current_path}"
bind l split-window -h  -c "#{pane_current_path}"

# Resize panes: prefix + shift+h/j/k/l (repeatable, 5 cells at a time)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Zoom current pane (mirrors Ghostty's cmd+shift+f)
bind f resize-pane -Z

# Toggle layout orientation (horizontal ↔ vertical)
bind o if -F "#{m:*\\{*,#{window_layout}}" "select-layout even-vertical" "select-layout even-horizontal"

# Delete current pane (no confirmation)
bind x kill-pane

# Window (tab) navigation: prefix + n/p, plus ctrl+shift+n/p to mirror Ghostty
bind -n C-S-n next-window
bind -n C-S-p previous-window
bind t new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
